<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMax | Acceso</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Lado izquierdo: marca + ilustración -->
  <section class="escena">
    <div class="marca">
      <img src="img/logo.svg" alt="Logo de AutoMax" width="56" height="56">
      <span>AutoMax</span>
    </div>
    <h1>El patio completo,<br>a un clic de distancia.</h1>
    <p>Entra para registrar, consultar y mantener al día los vehículos nuevos de la agencia.</p>
    <img class="auto" src="img/auto.svg" alt="">
  </section>

  <!-- Lado derecho: formularios -->
  <section class="panel">
    <div class="caja">
      <h2>Iniciar sesión</h2>

      <p id="mensaje" class="mensaje" role="status" hidden></p>

      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="lCorreo">Correo</label>
          <input type="email" id="lCorreo" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="campo">
          <label for="lPass">Contraseña</label>
          <input type="password" id="lPass" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-principal">Entrar</button>
      </form>

      <div class="o"><span>o</span></div>
      <button type="button" id="btnInvitado" class="btn-invitado">Entrar como invitado</button>
      <p class="enlace-auth">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    </div>
  </section>

  <script src="js/login.js"></script>
</body>
</html>
