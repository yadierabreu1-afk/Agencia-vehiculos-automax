<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMax | Crear cuenta</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <section class="escena">
    <div class="marca"><img src="/img/logo.svg" alt="Logo de AutoMax" width="56" height="56"><span>AutoMax</span></div>
    <h1>Tu cuenta,<br>tu agencia al día.</h1>
    <p>Registra tus datos para acceder al portal AutoMax.</p>
    <img class="auto" src="/img/auto.svg" alt="">
  </section>

  <section class="panel">
    <div class="caja">
      <h2>Crear cuenta</h2>
      <p id="mensaje" class="mensaje" role="status" hidden></p>
      <form id="formRegistro" novalidate>
        <div class="campo"><label for="rNombre">Nombre</label><input type="text" id="rNombre" autocomplete="name" placeholder="Tu nombre completo"></div>
        <div class="campo"><label for="rCorreo">Correo</label><input type="email" id="rCorreo" autocomplete="email" placeholder="tucorreo@ejemplo.com"></div>
        <div class="campo"><label for="rPass">Contraseña</label><input type="password" id="rPass" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div>
        <div class="campo"><label for="rPass2">Repite la contraseña</label><input type="password" id="rPass2" autocomplete="new-password"></div>
        <button type="submit" class="btn-principal">Crear cuenta</button>
      </form>
      <p class="enlace-auth">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
    </div>
  </section>
  <script src="/js/login.js"></script>
</body>
</html>
